# =============================================================================
# nginx.conf - Security Gateway (OpenResty = Nginx + LuaJIT)
# Mục 3.3: Reverse Proxy + tích hợp Lua Inspection Engine
# =============================================================================
user  root;                      # để worker ghi được file log đã mount ra host (môi trường lab)
worker_processes  auto;
error_log  /dev/stderr  warn;    # cảnh báo [SECURITY_ALERT] hiện ngay trong `docker logs`

events {
    worker_connections  4096;
}

http {
    # --- Khai báo đường dẫn thư viện Lua (utils.lua, security_check.lua ...) ---
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # --- Bộ nhớ chia sẻ giữa các worker cho Active Defense (tự khóa IP) ---
    lua_shared_dict sec_counter    10m;
    lua_shared_dict sec_blocklist  10m;

    # Giới hạn số bước backtracking của Regex (chống ReDoS làm treo gateway)
    lua_regex_match_limit  100000;

    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_requests  100000;    # cho phép load test dùng lại kết nối lâu (mặc định nginx đóng sau 1000 request)

    # Body <= 1MB giữ trong RAM để Lua đọc được bằng ngx.req.get_body_data()
    client_body_buffer_size  1m;
    client_max_body_size     1m;

    # Upstream trỏ tới service "backend" trong Docker Compose (giữ kết nối keep-alive
    # để độ trễ chèn thêm của Gateway là thấp nhất)
    upstream backend_service {
        server backend:5000;
        keepalive 64;
        keepalive_requests 100000;
    }

    server {
        listen 80;

        add_header X-Protected-By "OpenResty-Security-Gateway" always;

        # ---------------------------------------------------------------------
        # Giao diện theo dõi cảnh báo (Mục 3.6 - nâng cao). KHÔNG qua bộ lọc.
        # Chỉ cho phép dải mạng nội bộ / localhost / mạng Docker truy cập.
        # ---------------------------------------------------------------------
        location = /admin/dashboard {
            allow 127.0.0.1;  allow 10.0.0.0/8;  allow 172.16.0.0/12;  allow 192.168.0.0/16;
            deny  all;
            default_type text/html;
            alias /usr/local/openresty/nginx/admin_html/dashboard.html;
        }

        location /admin/logs {
            allow 127.0.0.1;  allow 10.0.0.0/8;  allow 172.16.0.0/12;  allow 192.168.0.0/16;
            deny  all;
            content_by_lua_file /usr/local/openresty/nginx/lua/admin_logs.lua;
        }

        # ---------------------------------------------------------------------
        # Mọi request còn lại: BẮT BUỘC đi qua bộ lọc Lua trước khi proxy_pass
        # ---------------------------------------------------------------------
        location / {
            # Core Inspection Engine: nếu phát hiện độc hại -> 403 + ngx.exit(),
            # nginx KHÔNG chạy tiếp xuống proxy_pass bên dưới
            access_by_lua_file /usr/local/openresty/nginx/lua/security_check.lua;

            proxy_pass http://backend_service;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Xuất thời gian kiểm tra của Lua (micro giây) ra header -> dùng cho báo cáo mục 4.1
            header_filter_by_lua_block {
                if ngx.ctx.inspect_us then
                    ngx.header["X-Inspection-Time-Us"] = string.format("%.0f", ngx.ctx.inspect_us)
                end
            }
        }
    }
}
